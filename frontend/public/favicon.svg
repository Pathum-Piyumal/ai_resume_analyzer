<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Premium 3-stop gradient for depth -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1D4ED8" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <!-- Glowing effect for the logo -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Shadow for the background card -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0F172A" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background squircle with drop shadow -->
  <rect width="440" height="440" x="36" y="36" rx="110" fill="url(#bgGradient)" filter="url(#cardShadow)" />

  <!-- Inner border ring for premium feel -->
  <rect width="432" height="432" x="40" y="40" rx="106" stroke="#ffffff" stroke-width="6" stroke-opacity="0.15" />

  <!-- Top glossy highlight curve -->
  <path d="M 36 146 A 110 110 0 0 1 146 36 L 366 36 A 110 110 0 0 1 476 146 C 360 170, 150 170, 36 146 Z" fill="#ffffff" fill-opacity="0.08" />

  <!-- Robot SVG paths centered, scaled, and glowing -->
  <g transform="translate(106, 120) scale(12.5)" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#glow)">
    <!-- Antenna -->
    <path d="M12 8V3.5M12 3.5H8.5" stroke="#22D3EE" stroke-width="2.2" />
    <circle cx="8.5" cy="3.5" r="1" fill="#22D3EE" stroke="none" />
    
    <!-- Ears / Connectors -->
    <path d="M2 14h2" stroke-width="2.2" />
    <path d="M20 14h2" stroke-width="2.2" />
    
    <!-- Main head/body -->
    <rect width="16" height="12" x="4" y="8" rx="2.5" fill="#1E293B" fill-opacity="0.2" stroke-width="2" />
    
    <!-- Eyes -->
    <circle cx="9" cy="13.5" r="1.2" fill="#22D3EE" stroke="none" />
    <circle cx="15" cy="13.5" r="1.2" fill="#22D3EE" stroke="none" />
    
    <!-- Mouth/Smile -->
    <path d="M10 17s1 1 2 1 2-1 2-1" stroke="#22D3EE" stroke-dasharray="0.1 0.1" />
  </g>
</svg>
